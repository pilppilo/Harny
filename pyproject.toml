[project]
name = "vharness"
version = "0.2.0"
description = "Pluggable LLM security harness: probe → generator → detector → evaluator"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3"]

[project.scripts]
vharness = "vharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vharness"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
