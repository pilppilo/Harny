[project]
name = "vharness"
version = "0.1.0"
description = "Extendable LLM-powered vulnerability scanner + fine-tune eval harness (C/C++, web, shell, distro configs)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vharness"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
